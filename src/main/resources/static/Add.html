<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member</title>
    <link rel="stylesheet" href="/Add.css">
</head>
<body>
    <div class="form-container">
        <h2>Add Member</h2>
        <form id="addMemberForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required><br><br>

            <label for="plan">Select Plan:</label>
            <select id="plan" name="plan" required>
                <option value="">Select a plan</option>
                <option value="1">Basic</option>
                <option value="2">Standard</option>
                <option value="3">Premium</option>
            </select><br><br>

            <label for="gymGoal">Select Gym Goal:</label>
            <select id="gymGoal" name="gymGoal" required>
                <option value="">Select a goal</option>
                <option value="1">Weight Loss</option>
                <option value="2">Muscle Gain</option>
                <option value="3">Fitness Maintainance</option>
            </select><br><br>

            <label for="status">Status:</label>
            <input type="checkbox" id="status" name="status"><br><br>

            <label for="phoneno">Phone Number:</label>
            <input type="tel" id="phoneno" name="phoneno" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" required></textarea><br><br>

            <button type="submit">Add Member</button>
        </form>
    </div>

    <script src="/addMember.js"></script>
</body>
</html>
