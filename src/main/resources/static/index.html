<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Member Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .status-active {
    color: green !important;
    font-weight: bold;
    }
    .status-inactive {
    color: red !important;
    font-weight: bold;
    }
    .plan-basic {
    color: #32cda6 !important; /* bronze */
    font-weight: bold;
    }
    .plan-standard {
    color: rgb(188, 155, 34) !important;
    font-weight: bold;
    }
    .plan-premium {
    color: rgb(0, 170, 255) !important;
    font-weight: bold;
    }

    .center-text {
      text-align: center;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="text-center mb-4">Gym Member Management</h1>
    <button id="addButton" class="btn btn-primary mb-3" onclick="toggleForm(true)">Add Member</button>

    <!-- Form Container -->
    <div id="formContainer" style="display: none;">
      <form id="memberForm" class="card p-4 mb-4 shadow">
        <input type="hidden" id="memberId">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Name</label>
            <input type="text" id="name" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Age</label>
            <input type="number" id="age" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Phone No</label>
            <input type="tel" id="phoneno" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Address</label>
            <input type="text" id="address" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Plan</label>
            <select id="plan" class="form-select" required>
              <option value="1">Basic</option>
              <option value="2">Standard</option>
              <option value="3">Premium</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label>Gym Goal</label>
            <select id="gymGoal" class="form-select" required>
              <option value="1">Weight Loss</option>
              <option value="2">Muscle Gain</option>
              <option value="3">Fitness Maintenance</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label>Status</label>
            <select id="status" class="form-select">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
        </div>
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success">Save Member</button>
          <button type="button" class="btn btn-secondary ms-2" onclick="toggleForm(false)">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Member List -->
    <div id="memberList">
      <table class="table table-bordered shadow bg-white text-center">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Plan</th>
            <th>Goal</th>
            <th>Status</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="memberTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8080/members";
    function toggleForm(show) {
      document.getElementById("formContainer").style.display = show ? "block" : "none";
      document.getElementById("memberList").style.display = show ? "none" : "block";
      document.getElementById("addButton").style.display = show ? "none" : "inline-block";
      if (!show) document.getElementById("memberForm").reset();
    }

    async function loadMembers() {
      const data = await fetch(`${API_URL}/`).then(res => res.json());
      const tbody = document.getElementById("memberTable");
      tbody.innerHTML = data.map(member => {
        const statusClass = member.status ? "status-active" : "status-inactive";
        const planClass = member.plan?.planName === "Basic" ? "plan-basic" : member.plan?.planName === "Standard" ? "plan-standard" : member.plan?.planName === "Premium" ? "plan-premium" : "";
        return `
          <tr>
            <td>${member.name}</td>
            <td>${member.age}</td>
            <td class="${planClass}">${member.plan?.planName || 'N/A'}</td>
            <td>${member.gymGoal?.goalType || 'N/A'}</td>
            <td class="${statusClass}">${member.status ? "Active" : "Inactive"}</td>
            <td>${member.phoneno}</td>
            <td>${member.email}</td>
            <td>
              <button onclick="editMember(${member.id})" class="btn btn-warning btn-sm">Edit</button>
              <button onclick="deleteMember(${member.id})" class="btn btn-danger btn-sm">Delete</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    document.getElementById("memberForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const member = {
        id: document.getElementById("memberId").value || null,
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        phoneno: document.getElementById("phoneno").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value,
        status: document.getElementById("status").value === "true",
        plan: { planId: document.getElementById("plan").value },
        gymGoal: { goalId: document.getElementById("gymGoal").value }
      };

      if (member.id) {
        await fetch(`${API_URL}/update/${member.id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(member)
        });
      } else {
        await fetch(`${API_URL}/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(member)
        });
      }

      toggleForm(false);
      loadMembers();
    });

    async function editMember(id) {
  // To Fetch the member data based on the ID
    const data = await fetch(`${API_URL}/`).then(res => res.json());
    const member = data.find(m => m.id === id); // Find the member by ID

    if (member) {
        // To Populate the form fields with the current member's data
        document.getElementById("memberId").value = member.id;
        document.getElementById("name").value = member.name;
        document.getElementById("age").value = member.age;
        document.getElementById("phoneno").value = member.phoneno;
        document.getElementById("email").value = member.email;
        document.getElementById("address").value = member.address;
        document.getElementById("status").value = member.status ? "true" : "false";
        document.getElementById("plan").value = String(member.plan?.planId);
        document.getElementById("gymGoal").value = String(member.gymGoal?.goalId);

        toggleForm(true);
        } else {
        console.error("Member not found.");
        }
    }


    async function deleteMember(id) {
      if (confirm("Are you sure you want to delete this member?")) {
        await fetch(`${API_URL}/delete/${id}`, { method: "DELETE" });
        loadMembers();
      }
    }

    loadMembers();
  </script>
</body>
</html>
